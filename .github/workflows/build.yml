name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Romanization tests
        run: python -m unittest discover -s scripts/readings -p "test_*.py"
      - name: Build, JUnit and Minecraft GameTests
        run: .\gradlew.bat build --console=plain
      - name: Inspect distribution
        run: python verification/audit_distribution.py
      - name: Package downloads
        run: .\scripts\Package-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: speakcraft-windows
          path: dist/*/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/
